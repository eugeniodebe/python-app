name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:

      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: eugedebe/python-app:${{ env.COMMIT_ID }}
    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: arc-runner-set
    steps:

      - uses: actions/checkout@v3

      - name: Update image tag in values.yaml
        shell: bash
        env:
          COMMIT_ID: ${{ needs.ci.outputs.commit_id }}
        run: |
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=amd64 ;;
          esac
          curl -sL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}" -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          "$RUNNER_TEMP/yq" -i '.image.tag = strenv(COMMIT_ID)' charts/python-app/values.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'charts/python-app/values.yaml'
          message: 'Updates values.yaml with commit ${{ needs.ci.outputs.commit_id }}'

      - name: Argo CD sync
        shell: bash
        run: |
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=amd64 ;;
          esac
          curl -ksSL -o "$RUNNER_TEMP/argocd" "https://argocd-server.argocd/download/argocd-linux-${ARCH}"
          chmod +x "$RUNNER_TEMP/argocd"
          "$RUNNER_TEMP/argocd" login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password "${{ secrets.ARGOCD_PASSWORD }}"
          "$RUNNER_TEMP/argocd" app sync python-app
